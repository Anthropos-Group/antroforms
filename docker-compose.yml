services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    # Si no vas a usar Caddy (ej. ya tienes Nginx/otro proxy en el servidor),
    # comenta el servicio "caddy" de abajo y descomenta esto para exponer
    # el puerto directo:
    # ports:
    #   - "3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
