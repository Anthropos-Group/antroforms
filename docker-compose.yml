services:
  app:
    build: .
    pull_policy: build
    # Un stack por cliente: cada uno con su TENANT, su base y su Twenty. El nombre
    # del contenedor es también el host que usa Cloudflare Tunnel.
    container_name: ${CONTAINER_NAME:-antroforms-web-strattos}
    restart: always
    environment:
      TENANT: ${TENANT:-edimca}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      TWENTY_API_URL: ${TWENTY_API_URL}
      TWENTY_API_KEY: ${TWENTY_API_KEY}
      CRON_SECRET: ${CRON_SECRET}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      ENCUESTADOR_ACCESS_PASSWORD: ${ENCUESTADOR_ACCESS_PASSWORD}
      # Tareas programadas dentro del contenedor (keep-alive de Supabase y
      # sincronización con Twenty). Ver docs/DEPLOY.md §6.
      TAREAS_PROGRAMADAS: ${TAREAS_PROGRAMADAS:-on}
      REFRESCO_MINUTOS: ${REFRESCO_MINUTOS:-3}
      SYNC_HORAS_ECUADOR: ${SYNC_HORAS_ECUADOR:-22}
      KEEPALIVE_MINUTOS: ${KEEPALIVE_MINUTOS:-60}
    expose:
      - "3000"
    networks:
      strattos-net:
        aliases:
          - ${CONTAINER_NAME:-antroforms-web-strattos}

networks:
  strattos-net:
    external: true
