# Stack «antroforms-postgres» (Portainer → Stacks → Add stack → Repository,
# compose path: infra/postgres/docker-compose.yml). Un solo Postgres para los
# clientes nuevos, una base por cliente; ver docs/POSTGRES.md.
services:
  # Nombres de servicio únicos: en strattos-net el nombre del servicio también es un
  # nombre de host, y «postgres» a secas choca con la base de otra app del servidor.
  antroforms-postgres:
    build: .
    pull_policy: build
    container_name: antroforms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      APROVISIONADOR_DB_PASSWORD: ${APROVISIONADOR_DB_PASSWORD:?Falta APROVISIONADOR_DB_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Diagnóstico: consultas lentas por tipo (sin guardar el texto de comandos
      # como ALTER ROLE … PASSWORD) y log en archivo legible por el aprovisionador.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - logging_collector=on
      - -c
      - log_directory=/pglogs
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_truncate_on_rotation=on
      - -c
      - log_rotation_age=1d
      - -c
      - log_file_mode=0644
      - -c
      - log_min_duration_statement=2000
      - -c
      - log_connections=off
      - -c
      - log_lock_waits=on
    volumes:
      - antroforms-pgdata:/var/lib/postgresql/data
      - antroforms-pglogs:/pglogs
    # Sin puertos publicados: solo lo alcanzan los contenedores de strattos-net.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [strattos-net]

  antroforms-aprovisionador:
    build: ../../aprovisionador
    pull_policy: build
    container_name: antroforms-aprovisionador
    restart: always
    depends_on:
      antroforms-postgres:
        condition: service_healthy
    environment:
      APROVISIONADOR_TOKEN: ${APROVISIONADOR_TOKEN:?Falta APROVISIONADOR_TOKEN}
      APROVISIONADOR_DB_PASSWORD: ${APROVISIONADOR_DB_PASSWORD}
      PGHOST: antroforms-postgres
      HOST_POSTGRES_APPS: antroforms-postgres
      # Ventana de mantenimiento (opción B): para permitir escrituras, poner la hora
      # de cierre (máx. 12 h desde ahora) y el cliente, y actualizar el stack. Vacío = cerrada.
      #   ESCRITURA_HABILITADA_HASTA=2026-11-23T15:30-05:00   ESCRITURA_CLIENTE=<slug>
      ESCRITURA_HABILITADA_HASTA: ${ESCRITURA_HABILITADA_HASTA:-}
      ESCRITURA_CLIENTE: ${ESCRITURA_CLIENTE:-}
    volumes:
      - antroforms-pglogs:/pglogs:ro
      - antroforms-respaldos:/respaldos:ro
    expose:
      - "8080"
    networks: [strattos-net]

  # Respaldo diario de todo el servidor (pg_dumpall) con retención 7 días,
  # 4 semanas y 6 meses. Copiar la carpeta de respaldos fuera del servidor.
  antroforms-respaldos:
    image: prodrigestivill/postgres-backup-local:17
    container_name: antroforms-respaldos
    restart: always
    depends_on:
      antroforms-postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: antroforms-postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_CLUSTER: "TRUE"
      SCHEDULE: "0 3 * * *"
      TZ: America/Guayaquil
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
    volumes:
      - antroforms-respaldos:/backups
    networks: [strattos-net]

volumes:
  antroforms-pgdata:
  antroforms-pglogs:
  antroforms-respaldos:

networks:
  strattos-net:
    external: true
